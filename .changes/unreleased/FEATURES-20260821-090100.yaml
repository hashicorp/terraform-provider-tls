kind: FEATURES
body: 'Added support for the post-quantum ML-DSA signature scheme ([FIPS 204](https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.204.pdf)). `ML-DSA-44`, `ML-DSA-65` and `ML-DSA-87` are now accepted as an `algorithm` by `tls_private_key` (resource and ephemeral resource). Each FIPS 204 parameter set is offered as its own algorithm because nothing within one is selectable, and each carries its own object identifier. ML-DSA keys can be used to create certificate requests and to sign certificates with `tls_cert_request`, `tls_self_signed_cert` and `tls_locally_signed_cert`, and are recognised by the `tls_public_key` data source and ephemeral resource. Note that OpenSSH defines no key type for ML-DSA, so the OpenSSH-related attributes are empty for these keys.'
time: 2026-08-21T09:01:00.000000+01:00
